name: Compiler l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compiler
        run: |
          ls -R | head -50
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "ERREUR : settings.gradle introuvable, fichiers manquants"; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FondDefilant.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FondDefilant-apk
          path: FondDefilant.apk
